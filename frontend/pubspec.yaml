name: nexo_ai
description: "Nexo AI - Sua segunda mente. Personal AI assistant for productivity and memory."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.1.0
  flutter: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  riverpod_annotation: ^2.1.0

  # Navigation
  go_router: ^12.0.0

  # HTTP & API
  dio: ^5.3.0
  retrofit: ^4.1.0

  # Authentication
  supabase_flutter: ^1.10.0
  flutter_secure_storage: ^9.0.0

  # Firebase (Push Notifications)
  firebase_core: ^2.24.0
  firebase_messaging: ^14.6.0

  # Payments
  flutter_stripe: ^10.2.0
  in_app_purchase: ^5.1.0
  storekit: ^0.3.0

  # UI & Widgets
  flutter_svg: ^2.0.0
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  animations: ^2.0.0
  lottie: ^2.7.0
  blur: ^3.2.0
  smooth_page_indicator: ^1.1.0

  # Utils
  intl: ^0.19.0
  timeago: ^3.6.0
  uuid: ^4.0.0
  url_launcher: ^6.2.0
  share_plus: ^7.2.0
  permission_handler: ^11.4.0

  # State & Models
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.0

  # Logging
  logger: ^2.1.0
  sentry_flutter: ^7.16.0

  # Local Storage
  hive: ^2.2.0
  hive_flutter: ^1.1.0

  # Sound
  just_audio: ^0.9.0
  speech_to_text: ^6.6.0
  text_to_speech: ^0.2.1

  # Analytics
  firebase_analytics: ^10.7.0
  amplitude_flutter: ^2.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^4.0.0

  # Code Generation
  build_runner: ^2.4.0
  freezed: ^2.4.0
  json_serializable: ^6.7.0
  retrofit_generator: ^8.1.0
  riverpod_generator: ^2.3.0

  # Testing
  mocktail: ^1.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
